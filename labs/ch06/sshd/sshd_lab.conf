# Lab 6.1 sshd configuration: a throwaway server on a high port.
# Start:  /opt/openssh10/sbin/sshd -D -f labs/ch06/sshd/sshd_lab.conf -p 2222
Port 2222
ListenAddress 127.0.0.1
HostKey /home/claude/pqm_book/labs/ch06/sshd/host_ed25519
HostKey /home/claude/pqm_book/labs/ch06/sshd/host_rsa
AuthorizedKeysFile /home/claude/pqm_book/labs/ch06/sshd/authorized_keys
PermitRootLogin prohibit-password
PasswordAuthentication no
StrictModes no
PidFile /home/claude/pqm_book/labs/ch06/sshd/sshd.pid
LogLevel VERBOSE
# Default KexAlgorithms in OpenSSH 10: mlkem768x25519-sha256 first. Override per scenario with -o.
