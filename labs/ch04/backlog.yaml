# Migration backlog input for Lab 4.1: the payments company from Chapters 1 and 3.
# Two kinds of node. Cryptographic assets carry the Chapter 1 fields and are scored
# for a finishing date. Enabling work (kind: enabler) has no cryptography of its own
# but other nodes depend on it; it inherits its deadline from its dependents.
# depends_on lists what must be finished before this node can be finished.

today: 2026-10-01
crqc_year: 2032
team_capacity: 2          # parallel migration streams the security team can run

nodes:
  # ---- enabling work ----
  - name: hsm-firmware-upgrade
    kind: enabler
    owner: platform
    migration_years: 0.5
    note: Vendor firmware with ML-KEM/ML-DSA mechanisms; requires a maintenance window per cluster.

  - name: client-sdk-update
    kind: enabler
    owner: mobile
    migration_years: 1.5
    note: Ship an SDK with a hybrid-capable TLS stack and wait for the fleet to update (18-month cycle).

  - name: trust-store-distribution
    kind: enabler
    owner: platform
    migration_years: 0.75
    note: Get the new ML-DSA root into every device and container trust store before any ML-DSA certificate is issued.

  - name: terminal-update-channel
    kind: enabler
    owner: terminals
    migration_years: 1.0
    note: A secure channel that can deliver a new signing root to 40,000 point-of-sale terminals.

  # ---- cryptographic assets (Chapter 1 fields) ----
  - name: payment-hsm-keywrap
    kind: asset
    owner: payments-core
    functions: [confidentiality]
    shelf_life_years: 7
    migration_years: 1.0
    jurisdictions: [EU]
    sectors: [finance]
    depends_on: [hsm-firmware-upgrade]

  - name: archive-backups
    kind: asset
    owner: data-platform
    functions: [confidentiality]
    shelf_life_years: 15
    migration_years: 2.0
    jurisdictions: [EU]
    sectors: [finance]
    depends_on: [payment-hsm-keywrap]

  - name: customer-api-tls
    kind: asset
    owner: api
    functions: [confidentiality, authentication]
    shelf_life_years: 2
    migration_years: 0.5
    jurisdictions: [EU, US]
    sectors: [finance, federal-contractor]
    depends_on: [client-sdk-update]

  - name: internal-ca-mldsa
    kind: asset
    owner: platform
    functions: [authentication]
    shelf_life_years: 3
    migration_years: 1.0
    jurisdictions: [EU]
    sectors: [finance]
    depends_on: [trust-store-distribution, hsm-firmware-upgrade]

  - name: service-mesh-mtls
    kind: asset
    owner: platform
    functions: [confidentiality, authentication]
    shelf_life_years: 1
    migration_years: 0.5
    jurisdictions: [EU]
    sectors: [finance]
    depends_on: [internal-ca-mldsa]

  - name: firmware-signing-pos
    kind: asset
    owner: terminals
    functions: [signing]
    shelf_life_years: 10
    migration_years: 1.5
    jurisdictions: [US]
    sectors: [nss]
    depends_on: [hsm-firmware-upgrade, terminal-update-channel]

  # ---- a mutual dependency, deliberately ----
  - name: acquirer-gateway-mtls
    kind: asset
    owner: payments-core
    functions: [confidentiality, authentication]
    shelf_life_years: 1
    migration_years: 0.5
    jurisdictions: [EU]
    sectors: [finance]
    depends_on: [partner-gateway-mtls]

  - name: partner-gateway-mtls
    kind: asset
    owner: partner-integration
    functions: [confidentiality, authentication]
    shelf_life_years: 1
    migration_years: 0.5
    jurisdictions: [EU]
    sectors: [finance]
    depends_on: [acquirer-gateway-mtls]
