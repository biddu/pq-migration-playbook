# The post-quantum regulatory calendar.
# One entry per dated obligation. This is a living file: the printed book
# (Appendix A) is a snapshot; the current version lives in the repository.
#
# Fields
#   id            short stable identifier
#   authority     who issued it
#   instrument    the document
#   jurisdiction  US | EU | UK | GLOBAL
#   sectors       who it binds: nss (US National Security Systems), federal,
#                 federal-contractor, critical-infrastructure, finance, all
#   function      what it constrains:
#                   confidentiality  (key establishment / encryption)
#                   authentication   (signatures in protocols, certificates)
#                   signing          (code and firmware signing)
#                   inventory        (cryptographic inventory / CBOM)
#                   plan             (migration plan or strategy)
#   kind          procurement | deadline | deprecation | disallow
#   date          ISO date the obligation bites
#   summary       one line
#   verified      date this entry was last checked against the primary source

version: 2026-09-12

instruments:

