# Discovery rules for Lab 3.1. One rule = one regular expression over one class of
# file, mapped to one cryptographic asset. Capture groups fill {1}, {2} in the asset
# fields. Keep rules boring and explicit: the scanner's job is to be auditable, not
# clever. Extend by adding rules, not by editing the scanner.
#
# quantum: NIST quantum security category the asset achieves (0 = broken by Shor).
# classical: classical security level in bits, where meaningful.

version: 2026-09-12

file_classes:
  python: ["*.py"]
  go: ["*.go"]
  java: ["*.java", "*.kt"]
  javascript: ["*.js", "*.ts"]
  nginx: ["nginx.conf", "*.nginx", "nginx/*.conf"]
  sshd: ["sshd_config", "ssh_config"]
  openssl_cnf: ["openssl.cnf", "*.cnf"]
  requirements: ["requirements*.txt", "pyproject.toml", "go.mod", "package.json", "pom.xml"]

rules:

  # ---------------- Python ----------------
  - id: py-rsa-keygen
    file_class: python
    pattern: 'rsa\.generate_private_key\([^)]*?key_size\s*=\s*(\d+)'
    asset: {name: RSA, primitive: pke, parameter_set: "RSA-{1}", functions: [keygen], oid: 1.2.840.113549.1.1.1, quantum: 0, classical: 112}
    note: Quantum-vulnerable; replace with ML-KEM (encryption) or ML-DSA (signing) depending on use.

  - id: py-rsa-oaep
    file_class: python
    pattern: 'padding\.OAEP\('
    asset: {name: RSA-OAEP, primitive: pke, parameter_set: RSA-OAEP, functions: [encrypt, decrypt], oid: 1.2.840.113549.1.1.7, quantum: 0}
    note: RSA key wrapping; migrate to ML-KEM-based envelope encryption (Chapter 9).

  - id: py-ec-keygen
    file_class: python
    pattern: 'ec\.generate_private_key\(\s*ec\.(SECP\w+|BrainpoolP\w+)'
    asset: {name: ECDSA, primitive: signature, parameter_set: "{1}", curve: "{1}", functions: [keygen], oid: 1.2.840.10045.2.1, quantum: 0, classical: 128}

  - id: py-jwt-alg
    file_class: python
    pattern: 'algorithm\s*=\s*["'']((?:RS|PS|ES|HS|EdDSA)\w*)["'']'
    asset: {name: "JWS {1}", primitive: signature, parameter_set: "{1}", functions: [sign, verify], quantum: 0}
    note: JOSE algorithm identifier; RS*/PS*/ES*/EdDSA are quantum-vulnerable, HS* is not.

  - id: py-sha1
    file_class: python
    pattern: 'hashlib\.sha1\('
    asset: {name: SHA-1, primitive: hash, parameter_set: SHA-1, functions: [digest], oid: 1.3.14.3.2.26, quantum: 0, classical: 63}
    note: Classically broken for collisions since 2017; flag regardless of quantum status.

  - id: py-md5
    file_class: python
    pattern: 'hashlib\.md5\('
    asset: {name: MD5, primitive: hash, parameter_set: MD5, functions: [digest], oid: 1.2.840.113549.2.5, quantum: 0, classical: 0}

  - id: py-aesgcm
    file_class: python
    pattern: 'AESGCM\('
    asset: {name: AES-GCM, primitive: ae, parameter_set: AES-GCM, mode: gcm, functions: [encrypt, decrypt], oid: 2.16.840.1.101.3.4.1.46, quantum: 1}
    note: Symmetric; key length decides the category (128-bit key = category 1, 256-bit = category 5). Confirm at review.

  - id: py-tls-minversion
    file_class: python
    pattern: 'TLSVersion\.TLSv1_(\d)'
    protocol: {type: tls, version: "1.{1}"}

  # ---------------- Go ----------------
  - id: go-ecdsa-keygen
    file_class: go
    pattern: 'ecdsa\.GenerateKey\(\s*elliptic\.(P\d+)\(\)'
    asset: {name: ECDSA, primitive: signature, parameter_set: "{1}", curve: "{1}", functions: [keygen], oid: 1.2.840.10045.2.1, quantum: 0, classical: 128}

  - id: go-rsa-keygen
    file_class: go
    pattern: 'rsa\.GenerateKey\([^,]+,\s*(\d+)\)'
    asset: {name: RSA, primitive: pke, parameter_set: "RSA-{1}", functions: [keygen], oid: 1.2.840.113549.1.1.1, quantum: 0, classical: 112}

  - id: go-tls-minversion
    file_class: go
    pattern: 'tls\.VersionTLS1(\d)'
    protocol: {type: tls, version: "1.{1}"}

  - id: go-tls-curve
    file_class: go
    pattern: 'tls\.(CurveP\d+|X25519MLKEM768|X25519)\b'
    asset: {name: "TLS group {1}", primitive: key-agree, parameter_set: "{1}", functions: [keygen], quantum: 0}
    note: X25519MLKEM768 is the hybrid group; the scanner marks it quantum 3 in post-processing.

  - id: go-sha1
    file_class: go
    pattern: '"crypto/sha1"'
    asset: {name: SHA-1, primitive: hash, parameter_set: SHA-1, functions: [digest], oid: 1.3.14.3.2.26, quantum: 0, classical: 63}

  # ---------------- Java / Kotlin ----------------
  - id: java-keypairgen
    file_class: java
    pattern: 'KeyPairGenerator\.getInstance\(\s*"(RSA|EC|DSA|DH|ML-KEM|ML-DSA)"'
    asset: {name: "{1}", primitive: pke, parameter_set: "{1}", functions: [keygen], quantum: 0}

  - id: java-signature
    file_class: java
    pattern: 'Signature\.getInstance\(\s*"([\w/]+)"'
    asset: {name: "{1}", primitive: signature, parameter_set: "{1}", functions: [sign, verify], quantum: 0}

  - id: java-cipher-rsa
    file_class: java
    pattern: 'Cipher\.getInstance\(\s*"(RSA[\w/-]*)"'
    asset: {name: "{1}", primitive: pke, parameter_set: "{1}", functions: [encrypt, decrypt], quantum: 0}

  # ---------------- JavaScript / TypeScript ----------------
  - id: js-generatekeypair
    file_class: javascript
    pattern: 'generateKeyPair(?:Sync)?\(\s*["''](rsa|ec|ed25519|x25519|rsa-pss)["'']'
    asset: {name: "{1}", primitive: pke, parameter_set: "{1}", functions: [keygen], quantum: 0}

  # ---------------- nginx ----------------
  - id: nginx-protocols
    file_class: nginx
    pattern: 'ssl_protocols\s+([^;]+);'
    protocol: {type: tls, version: "{1}"}

  - id: nginx-groups
    file_class: nginx
    pattern: 'ssl_ecdh_curve\s+([^;]+);'
    group_list: "{1}"
    note: Colon-separated TLS groups. X25519MLKEM768 present = hybrid enabled.

  - id: nginx-ciphers
    file_class: nginx
    pattern: 'ssl_ciphers\s+([^;]+);'
    cipher_list: "{1}"

  # ---------------- sshd ----------------
  - id: sshd-kex
    file_class: sshd
    pattern: '^\s*KexAlgorithms\s+(\S+)'
    kex_list: "{1}"
    note: Comma-separated. mlkem768x25519-sha256 or sntrup761x25519-sha256 present = post-quantum KEX.

  - id: sshd-hostkey
    file_class: sshd
    pattern: '^\s*HostKey\s+\S*ssh_host_(\w+)_key'
    asset: {name: "SSH host key {1}", primitive: signature, parameter_set: "{1}", functions: [sign], quantum: 0}

  # ---------------- dependency manifests ----------------
  - id: req-crypto-lib
    file_class: requirements
    pattern: '^(cryptography|pycryptodome|pyca|PyJWT|pyOpenSSL|liboqs-python|bcrypt|paramiko)\s*==\s*([\w.]+)'
    library: {name: "{1}", version: "{2}"}
